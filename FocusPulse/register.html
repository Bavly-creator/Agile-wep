<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FocusPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join FocusPulse to start tracking your study journey</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Nicole Aziz" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">University Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="student@ecu.edu.eg" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password (6+ characters)</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div id="registerErrorMsg" class="form-error"></div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1.25rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer-links">
        Already registered? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.redirectIfAuth();

    const form = document.getElementById('registerForm');
    const errorEl = document.getElementById('registerErrorMsg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;

      const result = Auth.register(name, email, pass);
      if (result.success) {
        Utils.showToast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.add('visible');
      }
    });
  </script>
</body>
</html>
