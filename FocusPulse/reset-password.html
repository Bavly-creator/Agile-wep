<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FocusPulse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Verify your email and choose a new secure password</p>
      </div>

      <form id="resetPassForm">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Registered Email</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="student@university.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="resetNewPass">New Password (6+ characters)</label>
          <input type="password" id="resetNewPass" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div id="resetErrorMsg" class="form-error"></div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1.25rem;">
          Update Password
        </button>
      </form>

      <div class="auth-footer-links">
        Remembered your password? <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('resetPassForm');
    const errorEl = document.getElementById('resetErrorMsg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const email = document.getElementById('resetEmail').value;
      const pass = document.getElementById('resetNewPass').value;

      const result = Auth.resetPassword(email, pass);
      if (result.success) {
        Utils.showToast(result.message, 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 800);
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.add('visible');
      }
    });
  </script>
</body>
</html>
