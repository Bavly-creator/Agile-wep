<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){try{var p=JSON.parse(localStorage.getItem('focuspulse_preferences')||'null');var t=p&&p.theme&&p.theme!=='system'?p.theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}})();</script><title>Course details · FocusPulse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/workspace.css"><link rel="stylesheet" href="css/sage-paper.css"><style>.course-detail-columns{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.course-detail-section{margin-top:1rem}.course-detail-section form{display:grid;gap:.6rem;margin:1rem 0}.course-detail-section input,.course-detail-section textarea{padding:.7rem}.course-detail-header{display:flex;align-items:center;gap:1rem}.course-detail-icon{display:grid;place-items:center;width:54px;height:54px;background:var(--color-surface-soft);border-radius:12px;font-size:1.6rem}@media(max-width:760px){.course-detail-columns{grid-template-columns:1fr}}</style></head><body><div class="workspace-shell"><aside class="workspace-sidebar"><a class="workspace-brand" href="dashboard.html"><span class="workspace-mark">F</span> FocusPulse</a><nav class="workspace-nav"></nav><button class="theme-toggle-btn" type="button" aria-label="Toggle color theme">Toggle theme</button></aside><main class="workspace-main"><header class="workspace-header"><div><div class="course-detail-header"><div id="courseIcon" class="course-detail-icon">▣</div><div><h1 id="courseTitle">Course details</h1><p id="courseDescription">Your course workspace and study record.</p></div></div></div><div class="workspace-actions"><a class="sage-btn" href="courses.html">Back to courses</a><a id="courseTimerLink" class="sage-btn primary" href="timer.html">Start a focus session</a></div></header><div class="workspace-grid"><section class="paper-card span-12"><div class="course-stats-grid"><div><strong id="courseMinutes">0 min</strong><span>Total focus</span></div><div><strong id="courseSessions">0</strong><span>Sessions</span></div><div><strong id="courseWeekly">0 min</strong><span>This week</span></div><div><strong id="courseProgress">0%</strong><span>Weekly goal</span></div></div><div class="course-progress-track"><div id="courseProgressBar"></div></div></section><div class="course-detail-columns span-12"><section class="paper-card course-detail-section"><h2>Lectures & sections</h2><form id="lectureForm"><input name="title" required maxlength="120" placeholder="Lecture or section title"><input name="reference" maxlength="80" placeholder="Week, date, or room (optional)"><button class="sage-btn primary" type="submit">Add lecture</button></form><div id="lectureList" class="item-list"></div></section><section class="paper-card course-detail-section"><h2>Assignments</h2><form id="assignmentForm"><input name="title" required maxlength="160" placeholder="Assignment or next task"><input name="due" type="date" aria-label="Due date"><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select><button class="sage-btn primary" type="submit">Add assignment</button></form><div id="assignmentList" class="item-list"></div></section><section class="paper-card course-detail-section span-12"><h2>Course notes</h2><form id="courseNoteForm"><input name="title" required maxlength="120" placeholder="Note title"><textarea name="body" rows="4" required placeholder="Keep a course-specific note here"></textarea><button class="sage-btn primary" type="submit">Save note</button></form><div id="courseNotes" class="item-list"></div></section></div></div></main></div><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/courses.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/course-details.js"></script><script>Auth.requireAuth();CourseDetails.init();</script></body></html>
